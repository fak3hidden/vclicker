[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vclicker"
version = "1.0.0"
description = "Native auto clicker, key holder, macro recorder and hotkey daemon with a modern Qt interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.5,<7"]
keywords = ["auto-clicker", "macro", "hotkeys", "automation", "pyside6"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]

[project.scripts]
vclicker = "vclicker.app:main"
bssmacro = "bssmacro.cli:main"

[project.optional-dependencies]
# Optional dependency group for the Bee Swarm Simulator macro (bssmacro).
# vclicker itself stays dependency-light; install these for the BSS macro:
#   pip install -e ".[bss]"
bss = [
    "numpy",
    "opencv-python-headless",
    "mss",
    "requests",
    "pillow",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vclicker*", "bssmacro*"]

[tool.setuptools.package-data]
vclicker = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/icons/*.svg"]
bssmacro = ["templates/*.md", "templates/*.png"]
