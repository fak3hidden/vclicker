[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bssmacro"
version = "0.1.0"
description = "Bee Swarm Simulator macro for Linux (Sober) — AI collector, windy/stinger farming, Discord progress"
readme = "bssmacro/README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "fak3hidden"}]
keywords = ["roblox", "sober", "bee-swarm-simulator", "macro", "linux", "wayland"]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "numpy",
    "opencv-python-headless",
    "mss",
    "requests",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
bssmacro = "bssmacro.cli:main"

[project.urls]
Homepage = "https://github.com/fak3hidden/vclicker"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["bssmacro*"]

[tool.setuptools.package-data]
bssmacro = ["templates/*.md", "templates/*.png", "requirements.txt"]
