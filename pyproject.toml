[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vclicker"
version = "1.0.0"
description = "Native auto clicker, key holder, macro recorder and hotkey daemon with a modern Qt interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.5,<7"]
keywords = ["auto-clicker", "macro", "hotkeys", "automation", "pyside6"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]

[project.scripts]
vclicker = "vclicker.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vclicker*"]

[tool.setuptools.package-data]
vclicker = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/icons/*.svg"]
